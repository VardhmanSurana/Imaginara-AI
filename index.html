<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-M-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imaginara: AI Image Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-bg: #121212;
            --color-surface: #1E1E1E;
            --color-surface-secondary: #2D2D2D;
            --color-surface-muted: #3A3A3A;
            --color-surface-muted-hover: #4A4A4A;
            
            --color-text-primary: #E0E0E0;
            --color-text-secondary: #A0A0A0;
            --color-text-tertiary: #BDBDBD;
            --color-text-inverted: #121212;

            --color-border-base: #2D2D2D;
            --color-border-muted: #3A3A3A;

            --color-brand: #9333EA; /* purple-600 */
            --color-brand-hover: #7E22CE; /* purple-700 */
            --color-brand-text: #FFFFFF;
            --color-brand-subtle-bg: rgba(147, 51, 234, 0.1);
            --color-brand-subtle-text: #C084FC; /* purple-400 */
            --color-accent: #F59E0B; /* amber-500 */
            
            --color-error-bg: rgba(220, 38, 38, 0.15);
            --color-error-border: #DC2626; /* red-600 */
            --color-error-text: #F87171; /* red-400 */

            --color-overlay: rgba(18, 18, 18, 0.7);
            --color-surface-translucent: rgba(30, 30, 30, 0.5);

            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .navbar-glass {
            background: rgba(18, 18, 18, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border-base);
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .landing-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .landing-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-xl);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg': 'var(--color-bg)',
                        'surface': 'var(--color-surface)',
                        'surface-secondary': 'var(--color-surface-secondary)',
                        'surface-muted': 'var(--color-surface-muted)',
                        'surface-muted-hover': 'var(--color-surface-muted-hover)',
                        
                        'text-primary': 'var(--color-text-primary)',
                        'text-secondary': 'var(--color-text-secondary)',
                        'text-tertiary': 'var(--color-text-tertiary)',
                        'text-inverted': 'var(--color-text-inverted)',
                        
                        'border-base': 'var(--color-border-base)',
                        'border-muted': 'var(--color-border-muted)',
                        
                        'brand': 'var(--color-brand)',
                        'brand-hover': 'var(--color-brand-hover)',
                        'brand-text': 'var(--color-brand-text)',
                        'brand-subtle-bg': 'var(--color-brand-subtle-bg)',
                        'brand-subtle-text': 'var(--color-brand-subtle-text)',
                        'accent': 'var(--color-accent)',

                        'error-bg': 'var(--color-error-bg)',
                        'error-border': 'var(--color-error-border)',
                        'error-text': 'var(--color-error-text)',

                        'overlay': 'var(--color-overlay)',
                        'surface-translucent': 'var(--color-surface-translucent)',
                    },
                },
            },
        };
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.19.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
